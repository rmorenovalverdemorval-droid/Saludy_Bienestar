<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Respiración guiada</title>
<style>
:root{--bg:#f2f9fb;--fg:#1d4a58;--accent:#67bed9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a20;--fg:#d6eef6}}
:root[data-theme="dark"]{--bg:#0d1a20;--fg:#d6eef6}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.wrap{position:relative;width:min(80vw,60vh,420px);aspect-ratio:1}
svg{width:100%;height:100%;overflow:visible}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#label{font-size:clamp(24px,6vw,38px);font-weight:300;letter-spacing:.04em;transition:opacity .4s}
#count{font-size:clamp(16px,3.5vw,22px);opacity:.6;margin-top:6px}
button{background:none;border:1px solid var(--accent);color:var(--fg);padding:8px 22px;border-radius:999px;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <svg viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="80" fill="none" stroke="#67bed9" stroke-width="3"/>
    <g id="pts" fill="#67bed9" opacity=".55"></g>
    <circle id="ball" r="9" fill="#67bed9" style="filter:drop-shadow(0 0 6px #67bed9)"/>
  </svg>
  <div class="center"><div id="label">Inhalar</div><div id="count">4</div></div>
</div>
<button id="btn">Pausar</button>
<script>
const R=80,C=100;
const phases=[
  {t:"Inhalar",a:240,b:360,d:4},
  {t:"Mantén",a:0,b:120,d:4},
  {t:"Exhalar",a:120,b:240,d:6}
];
const pos=a=>{const r=a*Math.PI/180;return[C+R*Math.sin(r),C-R*Math.cos(r)]};
const pts=document.getElementById('pts');
[240,0,120].forEach(a=>{const[x,y]=pos(a);const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',4);pts.appendChild(c)});
const ball=document.getElementById('ball'),label=document.getElementById('label'),count=document.getElementById('count'),btn=document.getElementById('btn');
const total=phases.reduce((s,p)=>s+p.d,0);
let elapsed=0,last=null,running=true,shown='';
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function frame(now){
  if(last!==null&&running)elapsed=(elapsed+(now-last)/1000)%total;
  last=now;
  let e=elapsed,p=phases[0];
  for(const ph of phases){if(e<ph.d){p=ph;break}e-=ph.d}
  const[x,y]=pos(p.a+(p.b-p.a)*ease(e/p.d));
  ball.setAttribute('cx',x);ball.setAttribute('cy',y);
  if(shown!==p.t){shown=p.t;label.textContent=p.t}
  count.textContent=Math.ceil(p.d-e);
  requestAnimationFrame(frame);
}
btn.onclick=()=>{running=!running;btn.textContent=running?'Pausar':'Continuar'};
requestAnimationFrame(frame);
</script>
</body>
</html>
